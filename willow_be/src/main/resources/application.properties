spring.application.name=willow-backend
server.port=8080

# Secrets live outside git: in environment variables, or in willow_be/.env (git-ignored).
# The second path covers running the app from the repository root (e.g. from an IDE).
spring.config.import=optional:file:.env[.properties],optional:file:willow_be/.env[.properties]

# PostgreSQL Database Configuration
# DB_URL and DB_USERNAME default to the local database; DB_PASSWORD has no default and must be set.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/willow_local}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

# JPA Configuration
# Tables are created by the SQL scripts in src/main/resources/db; Hibernate only checks they match the entities.
spring.jpa.hibernate.ddl-auto=validate
spring.sql.init.mode=never
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_batch_fetch_size=50

# CORS Configuration
willow.cors.allowed-origins=http://localhost:5173,http://localhost:5174

# Curated Fit
# Addresses the Willow website (willow_fe) is served from, comma separated. Sellers paste product
# links from here to build a Curated Fit; links to anywhere else are refused.
willow.storefront.urls=http://localhost:5173

# Product photo uploads
# Folder (relative to where the backend is started) that uploaded photos are saved in; served at /uploads.
willow.uploads.dir=uploads
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# Time Zone
willow.timezone=Asia/Kolkata