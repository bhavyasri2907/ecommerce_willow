spring.application.name=cara-backend
server.port=8080

# --- Default: in-memory H2, zero setup, seeded from data.sql ---
spring.datasource.url=jdbc:h2:mem:cara;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.sql.init.mode=always
# Hibernate must create the tables before data.sql inserts into them
spring.jpa.defer-datasource-initialization=true
spring.h2.console.enabled=true

# --- To use real PostgreSQL instead, comment the H2 block above and uncomment below ---
# spring.datasource.url=jdbc:postgresql://localhost:5432/cara
# spring.datasource.driver-class-name=org.postgresql.Driver
# spring.datasource.username=cara
# spring.datasource.password=cara
# spring.jpa.hibernate.ddl-auto=update
# spring.sql.init.mode=never

spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Allow the Vite dev server to call this API
cara.cors.allowed-origin=http://localhost:5173
