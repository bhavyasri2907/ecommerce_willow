spring.application.name=willow-backend
server.port=8080

# PostgreSQL Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/willow_local
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=postgres
spring.datasource.password=bhavyaSri54

# JPA Configuration
# Tables are created by the SQL scripts in src/main/resources/db; Hibernate only checks they match the entities.
spring.jpa.hibernate.ddl-auto=validate
spring.sql.init.mode=never
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_batch_fetch_size=50

# CORS Configuration
willow.cors.allowed-origins=http://localhost:5173,http://localhost:5174

# Product photo uploads
# Folder (relative to where the backend is started) that uploaded photos are saved in; served at /uploads.
willow.uploads.dir=uploads
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# Time Zone
willow.timezone=Asia/Kolkata