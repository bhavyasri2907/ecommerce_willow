spring.application.name=willow-backend
server.port=8080

# --- Default: in-memory H2, zero setup. Starts empty: all data is created through the API ---
spring.datasource.url=jdbc:h2:mem:willow;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.sql.init.mode=never
spring.h2.console.enabled=true

# --- To use real PostgreSQL instead, comment the H2 block above and uncomment below ---
# spring.datasource.url=jdbc:postgresql://localhost:5432/willow
# spring.datasource.driver-class-name=org.postgresql.Driver
# spring.datasource.username=willow
# spring.datasource.password=willow
# spring.jpa.hibernate.ddl-auto=update
# spring.sql.init.mode=never

spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
# Every service method declares its own transaction; don't hold sessions open for the whole request
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_batch_fetch_size=50

# Allow the storefront (5173) and the seller dashboard (5174) to call this API
willow.cors.allowed-origins=http://localhost:5173,http://localhost:5174

# Time zone used to bucket analytics by calendar day
willow.timezone=Asia/Kolkata
